<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 背景容器 -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)" />
  <rect width="48" height="48" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  
  <!-- 光晕 -->
  <circle cx="16" cy="16" r="14" fill="url(#glow)" />

  <!-- 3 条上升的商业数据分析柱状图 -->
  <rect x="10" y="25" width="6" height="14" rx="2" fill="url(#bar1)" filter="url(#shadow)" />
  <rect x="19" y="17" width="6" height="22" rx="2" fill="url(#bar2)" filter="url(#shadow)" />
  <rect x="28" y="10" width="6" height="29" rx="2" fill="url(#bar3)" filter="url(#shadow)" />

  <!-- 顶部 AI 智能闪烁星标 -->
  <path d="M40 8L41.5 13L46.5 14.5L41.5 16L40 21L38.5 16L33.5 14.5L38.5 13Z" fill="#38bdf8" filter="url(#shadow)" />
</svg>
